# Local stack for the streaming design. Resource limits are declared rather than
# left to the daemon's defaults, because the demo's whole point is knowing which
# component saturates first — an unbounded container makes that unattributable.
#
# Docker on the target machine is allocated 4 CPUs / 8.3 GB in total, so these
# reservations are a budget, not a wish.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: srisk-clickhouse
    # Host ports are offset into a private range: 8123 and 9000 are common
    # defaults and collide with other local stacks (a Supabase stack was already
    # holding 8123 on the target machine). Container ports are unchanged.
    ports:
      - "18123:8123"  # HTTP interface
      - "19000:9000"  # native protocol
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: srisk
      CLICKHOUSE_USER: srisk
      CLICKHOUSE_PASSWORD: srisk
      # Without this the default user is passwordless and the server refuses
      # remote connections on newer images.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # Artifact API. Stdlib only, computes nothing (ADR-0011) — which is why it can
  # be replicated freely and why the cache in front of it is what absorbs reader
  # load rather than the service itself.
  api:
    image: python:3.11-alpine
    container_name: srisk-api
    command: python /app/server.py --artifacts /artifacts --port 8088
    volumes:
      - ./api/server.py:/app/server.py:ro
      - ./out/artifacts:/artifacts:ro
    expose:
      - "8088"
    ports:
      - "18088:8088"   # direct access, for comparing against the cached path
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  varnish:
    image: varnish:7.5
    container_name: srisk-varnish
    depends_on:
      - api
    volumes:
      - ./api/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "18081:80"
    environment:
      # Small on purpose: the working set is a handful of JSON files totalling
      # ~400 KB, so a large cache would prove nothing about the policy.
      VARNISH_SIZE: 64M
    # No tmpfs over /var/lib/varnish: the image already ships it owned by the
    # varnish user (uid 1000), and mounting a tmpfs there masks it with a
    # root-owned directory, which makes varnishd exit with "Permission denied".
    # The default malloc storage is in memory anyway, so the tmpfs bought
    # nothing.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  clickhouse-data:
