# Local stack for the streaming design. Resource limits are declared rather than
# left to the daemon's defaults, because the demo's whole point is knowing which
# component saturates first — an unbounded container makes that unattributable.
#
# Docker on the target machine is allocated 4 CPUs / 8.3 GB in total, so these
# reservations are a budget, not a wish.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: srisk-clickhouse
    # Host ports are offset into a private range: 8123 and 9000 are common
    # defaults and collide with other local stacks (a Supabase stack was already
    # holding 8123 on the target machine). Container ports are unchanged.
    ports:
      - "18123:8123"  # HTTP interface
      - "19000:9000"  # native protocol
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: srisk
      CLICKHOUSE_USER: srisk
      CLICKHOUSE_PASSWORD: srisk
      # Without this the default user is passwordless and the server refuses
      # remote connections on newer images.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # The log between producer and consumer (ADR-0013). KRaft mode: the broker is
  # its own controller, so there is no ZooKeeper container. That matters here
  # because the budget below is shared with ClickHouse, and a second JVM for
  # coordination would cost more than the log is worth at this rate.
  #
  # The justification is never throughput — per-event work measures 32-108x
  # faster than the 8,333 ev/s the brief's ceiling requires. It is observable
  # lag, live rescale, and replay to a watermark.
  kafka:
    image: apache/kafka:3.8.0
    container_name: srisk-kafka
    ports:
      - "19092:19092"  # host listener; 9092 is a common default and collides
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three listeners, and all three are load-bearing. INTERNAL carries
      # container-to-container traffic (AKHQ, scaled consumers); EXTERNAL is
      # advertised as localhost so a producer on the host can reach it;
      # CONTROLLER is KRaft's own quorum. Advertising only one of these is the
      # single most common way to get a broker that starts and then refuses
      # every connection.
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so nothing can be replicated. Stated rather than left at
      # a default that would make every topic creation fail.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Six partitions. The count is the ceiling on consumer parallelism
      # (ADR-0010) and cannot be raised at runtime without repartitioning, so it
      # is chosen up front: the scaling demo goes to 3 consumers, and 6 divides
      # evenly by 1, 2, 3 and 6 so every step of that demo rebalances into equal
      # shares rather than a skewed one. Docker has 4 CPUs, so more than 6 would
      # buy parallelism the machine cannot execute.
      KAFKA_NUM_PARTITIONS: 6
      # Retention bounds ADR-0009's replay-to-watermark guarantee. Beyond it the
      # claim weakens from "reproducible" to "audited" — 24h is far longer than
      # any run here, so the boundary is real but never reached in the demo.
      KAFKA_LOG_RETENTION_HOURS: 24
      # 1 GB heap. The JVM competes with the thing being measured, so it is
      # capped rather than left to default to a quarter of container memory.
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    deploy:
      resources:
        limits:
          # 1 CPU / 1.5 GB. ClickHouse keeps 2 CPUs because it is the component
          # under test; the broker is deliberately the modest one, which is
          # defensible precisely because the rate does not need a log.
          cpus: "1.0"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Kafka ships no UI. AKHQ gives topics, consumer groups and per-partition lag
  # — the operator's view of the number ADR-0010 makes central.
  akhq:
    image: tchiotludo/akhq:0.25.1
    container_name: srisk-akhq
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            srisk:
              properties:
                bootstrap.servers: "kafka:9092"
      JAVA_OPTS: "-Xmx256m"
    deploy:
      resources:
        limits:
          # A UI, not a measured component. Kept small so it does not distort
          # the figures for the things that are.
          cpus: "0.5"
          memory: 512M

  # Artifact API. Stdlib only, computes nothing (ADR-0011) — which is why it can
  # be replicated freely and why the cache in front of it is what absorbs reader
  # load rather than the service itself.
  api:
    image: python:3.11-alpine
    container_name: srisk-api
    command: python /app/server.py --artifacts /artifacts --port 8088
    volumes:
      - ./api/server.py:/app/server.py:ro
      - ./out/artifacts:/artifacts:ro
    expose:
      - "8088"
    ports:
      - "18088:8088"   # direct access, for comparing against the cached path
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  varnish:
    image: varnish:7.5
    container_name: srisk-varnish
    depends_on:
      - api
    volumes:
      - ./api/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "18081:80"
    environment:
      # Small on purpose: the working set is a handful of JSON files totalling
      # ~400 KB, so a large cache would prove nothing about the policy.
      VARNISH_SIZE: 64M
    # No tmpfs over /var/lib/varnish: the image already ships it owned by the
    # varnish user (uid 1000), and mounting a tmpfs there masks it with a
    # root-owned directory, which makes varnishd exit with "Permission denied".
    # The default malloc storage is in memory anyway, so the tmpfs bought
    # nothing.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # The consumer, containerised **only** so it can be scaled live:
  #   docker compose up -d --scale consumer=3
  # Deliberately no `container_name` — a fixed name caps the service at one
  # replica, which would make the demo's key move impossible.
  #
  # All replicas share one group.id, so Kafka assigns partitions between them
  # and adding a replica is a rebalance rather than a restart (ADR-0013). The
  # safety of that move traces to ADR-0007: ingestion is idempotent and
  # order-independent, so a partition changing hands mid-batch replays rows that
  # collapse to the same state instead of corrupting them.
  consumer:
    image: python:3.11-slim
    depends_on:
      kafka:
        condition: service_healthy
    # The repo root, not just `streaming/`: the consumer normalises the market at
    # ingest (ADR-0004) using `betflow/src/load.py`, so mounting the streaming
    # directory alone gives ModuleNotFoundError on `src.load`.
    volumes:
      - ../:/app:ro
    working_dir: /app
    # Wheel is prebuilt for glibc, so slim needs no compiler for librdkafka.
    command:
      - sh
      - -c
      - >-
        pip install --quiet --root-user-action=ignore confluent-kafka &&
        python -m streaming.consumer --source kafka
        --brokers kafka:9092 --url http://clickhouse:8123
        --group "$${CONSUMER_GROUP:-betflow-consumer}"
        --batch-size 20000 --flush-ms 1000 --idle-timeout 3600
    environment:
      # All replicas must share one group for partitions to be divided between
      # them rather than every replica receiving every event.
      CONSUMER_GROUP: "${CONSUMER_GROUP:-betflow-consumer}"
    deploy:
      resources:
        limits:
          # 0.5 CPU each. Three replicas is 1.5 CPUs, which still leaves the
          # broker and ClickHouse their share inside the 4 available.
          cpus: "0.5"
          memory: 512M
    profiles:
      # Not started by a bare `up`: the throughput and lag measurements run the
      # consumer on the host, and only the rescale demo wants it in a container.
      - scale

volumes:
  clickhouse-data:
